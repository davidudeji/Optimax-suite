        <p>Choose the best plan that suits your needs.</p>
        <form (ngSubmit)="onSubmit()">
          <label for="plan-option">Plan Option:</label>

          <input type="text" id="plan-option" required>

      <div class="signup-right">

      </div>
    </div>
  </section>
