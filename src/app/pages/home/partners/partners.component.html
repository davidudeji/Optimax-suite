<section class="partners-section" aria-labelledby="partners-title">
  <div class="partners-container">
    <header class="partners-heading">
      <p class="partners-eyebrow">Trusted partners</p>
      <h2 id="partners-title">Trusted by businesses across Africa and beyond</h2>
      <p class="partners-description">
        Powering growth for SMEs and enterprises across every sector.
      </p>
    </header>

    <ul class="partner-list" aria-label="Trusted partners">
      <li class="partner-chip" *ngFor="let partner of partners">{{ partner }}</li>
    </ul>
  </div>
</section>
