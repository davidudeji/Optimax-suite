<section class="impact-section" aria-labelledby="impact-title">
  <div class="impact-container">
    <h2 class="visually-hidden" id="impact-title">Optimax impact</h2>

    <ul class="impact-grid">
      <li class="impact-metric" *ngFor="let metric of metrics">
        <p class="impact-value">
          <span class="visually-hidden">{{ metric.accessibleValue }}</span>
          <span aria-hidden="true">
            {{ metric.current | number }}<span class="impact-suffix">{{ metric.suffix }}</span>
          </span>
        </p>
        <p class="impact-label" aria-hidden="true">{{ metric.label }}</p>
      </li>
    </ul>

    <div class="impact-caption">
      <p>Growing every month — built for businesses across Africa and beyond</p>
    </div>
  </div>
</section>
