<section id="Contact" class="contact-section">
  <div class="container">
    <div class="right">
      <form class="contact--form--container" (ngSubmit)="handleSubmit()">
        <h2 class="moving-title">Contact Us Today</h2>

        <div class="form-group">
          <label for="firstName" class="contact--label">
            <span class="text-md">
              First Name
              <i
                class="fa fa-asterisk"
                style="font-size: 12px; color: rgb(231, 93, 93)"
                aria-hidden="true"
              ></i>
            </span>
            <input
              type="text"
              class="contact--input"
              name="firstName"
              id="firstName"
              [(ngModel)]="contactInfo.firstName"
              required
            />
          </label>

          <label for="lastName" class="contact--label">
            <span
              >Last Name
              <i
                class="fa fa-asterisk"
                style="font-size: 12px; color: rgb(231, 93, 93)"
                aria-hidden="true"
              ></i
            ></span>
            <input
              type="text"
              class="contact--input"
              name="lastName"
              id="lastName"
              [(ngModel)]="contactInfo.lastName"
              required
            />
          </label>

          <label for="company" class="contact--label">
            <span
              >Company Name
              <i
                class="fa fa-asterisk"
                style="font-size: 12px; color: rgb(231, 93, 93)"
                aria-hidden="true"
              ></i
            ></span>
            <input
              type="text"
              class="contact--input"
              name="company"
              id="company"
              [(ngModel)]="contactInfo.company"
              required
            />
          </label>
        </div>

        <div class="form-container">
          <!-- Business Email Field -->
          <div class="form-field email-field">
            <label for="email" class="contact--label">
              <span
                >Business Email
                <i
                  class="fa fa-asterisk"
                  style="font-size: 12px; color: rgb(231, 93, 93)"
                  aria-hidden="true"
                ></i
              ></span>
              <input
                type="email"
                class="contact--input"
                name="email"
                id="email"
                [(ngModel)]="contactInfo.email"
                required
              />
            </label>
          </div>

          <div class="form-field">
            <label for="phone" class="contact--label">
              <span
                >Phone Number
                <i
                  class="fa fa-asterisk"
                  style="font-size: 12px; color: rgb(231, 93, 93)"
                  aria-hidden="true"
                ></i
              ></span>
              <input
                type="tel"
                name="phone"
                class="contact--input"
                id="phone"
                [(ngModel)]="contactInfo.phone"
                required
              />
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="company-size" class="contact--label">
            <span
              >Company Size
              <i
                class="fa fa-asterisk"
                style="font-size: 12px; color: rgb(231, 93, 93)"
                aria-hidden="true"
              ></i
            ></span>

            <ng-select
              name="number"
              [items]="numberOptions"
              bindLabel="option"
              bindValue="option"
              class="custom-ng-select"
              [(ngModel)]="contactInfo.number"
              placeholder="select company size"
            ></ng-select>
          </label>

          <label for="product-interests" class="contact--label">
            <span>
              What products interest you?
              <i
                class="fa fa-asterisk"
                style="font-size: 12px; color: rgb(231, 93, 93)"
                aria-hidden="true"
              ></i>
            </span>
            <!-- ng-select for multiple selections -->
            <ng-select
              name="service"
              [items]="servicesOption"
              bindLabel="options"
              bindValue="options"
              class="custom-ng-select"
              [(ngModel)]="contactInfo.service"
              [multiple]="true"
              placeholder="products"
            ></ng-select>
          </label>

          <label for="industry" class="contact--label">
            <span
              >Your Industry
              <i
                class="fa fa-asterisk"
                style="font-size: 12px; color: rgb(231, 93, 93)"
                aria-hidden="true"
              ></i
            ></span>

            <ng-select
              name="industry"
              [items]="industryOption"
              bindLabel="option"
              bindValue="option"
              class="custom-ng-select"
              [(ngModel)]="contactInfo.industry"
              [multiple]="true"
              placeholder="industries"
            ></ng-select>
          </label>
        </div>

        <label for="message" class="contact--label">
          <span
            >Message
            <i
              class="fa fa-asterisk"
              style="font-size: 12px; color: rgb(231, 93, 93)"
              aria-hidden="true"
            ></i
          ></span>
          <textarea
            class="contact--input"
            name="message"
            id="message"
            [(ngModel)]="contactInfo.message"
            rows="8"
            placeholder="Type your message..."
            required
          ></textarea>
        </label>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>

        <div>
          <button
            type="submit"
            class="btn btn-primary contact--form--btn"
            [disabled]="isLoading"
          >
            {{ isLoading ? "Sending..." : "Submit" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
<app-contactmap></app-contactmap>
