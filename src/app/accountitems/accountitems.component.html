<section class="features" #featureSection>
  <div class="wave-container">
    <div class="container">
      <h2 class="bold">
        OptimaX <b class="bold">ERP </b> Account Management Features
      </h2>
      <div class="feature-list">
        <div
          class="feature-item"
          *ngFor="let feature of features"
          [style.top.px]="feature.top"
          [style.left.px]="feature.left"
        >
          <img
            class="feature-image"
            [src]="feature.img"
            alt="{{ feature.title }}"
          />
          <div class="textBlock">
            <h3>{{ feature.title }}</h3>
            <p class="">{{ feature.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
