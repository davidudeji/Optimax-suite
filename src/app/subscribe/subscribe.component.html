  <div class="subscribe-right">
    <h2 class="subscribe-title">Subscribe to Our Newsletter</h2>
    <p>
      Stay ahead with the latest news, updates, and special offers from Optima<b
        class="bold"
        >X</b
      >
      - <b class="bold">ERP</b>. <br />Be the first to know about our new
      features, industry insights, and exclusive promotions<br />
      tailored to boost your business.
    </p>
    <form (ngSubmit)="onSubmit()" class="subscribe-form">
      <label for="email" class="email-label">Enter your email:</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        (ngModelChange)="updateEmail($event)"
        required
        class="email-input"
        placeholder="damilola@centrifugegroup.com"
      />
      <button type="submit" class="subscribe-button" [disabled]="isSubscribing">
        {{ isSubscribing ? "Subscribing..." : "Subscribe" }}
      </button>
    </form>

    <div *ngIf="subscriptionSuccess" class="success-message">
      Thank you for subscribing!
    </div>
    <div *ngIf="subscriptionError" class="error-message">
      {{ subscriptionError }}
    </div>
  </div>
</div>
