<!-- choose-plan-step1.component.html -->
<div class="signup-section">
    <div class="signup-container">
      <div class="signup-left">
        <h3>Choose Your Plan</h3>
        <p>Fill in the details below to get started.</p>
        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="firstName">First Name</label> <br>
            <input id="firstName" formControlName="firstName" type="text" required>
            <label for="lastName">Last Name</label> <br>
            <input id="lastName" formControlName="lastName" type="text" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label> <br>
            <input id="password" formControlName="password" type="password" required>
          </div>
          <div class="form-group">
            <label for="role">Role</label> <br>
            <input id="role" formControlName="role" type="text" required>
            <label for="company">Company</label> <br>
            <input id="company" formControlName="company" type="text" required>
          </div>
          <button type="submit" class="btn">Sign Up</button>
        </form>
      </div>
      <div class="signup-right">
        <!-- Right div content will go here -->
      </div>
    </div>
  </div>
