server {
    listen 80;
    server_name www.optimaxsuites.com optimaxsuites.com;

    # Path to the Angular build output
    root /var/www/optimax-landing/dist/erp-landing-page;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        # This is the critical line for Angular SPA routing.
        # Try the exact file, then a directory, then fall back to index.html.
        # Without this, any direct URL like /blog/my-post returns a server 404.
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html (so Angular updates are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
